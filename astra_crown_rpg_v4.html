function renderHome(el){const pct=Math.min(100,S.exp/needExp(S.rank)*100),lead=M(S.party[0]),lo=S.owned[S.party[0]];el.innerHTML=`<section class="hero"><div class="tiny muted">MONSTER COLLECTION × COMMAND BATTLE</div><h1>倒して、手に入れて、<br>次の強敵へ。</h1><p>通常クエストのモンスターも、降臨ボスも、ガチャ限定もすべて同じモンスターBOXへ。4体編成のコマンドRPGで攻略しよう。</p><div style="margin-top:18px"><button class="bigbtn" onclick="go('quests')">クエストへ ⚔️</button></div></section><div class="section-title"><h2>プレイヤー</h2><span class="tiny muted">次ランクまで ${needExp(S.rank)-S.exp} EXP</span></div><div class="card"><div style="display:flex;justify-content:space-between"><b>RANK ${S.rank}</b><span>${S.exp}/${needExp(S.rank)} EXP</span></div><div class="progress"><i style="width:${pct}%"></i></div></div><div class="section-title"><h2>現在のパーティ</h2><button class="btn" onclick="go('box')">編成</button></div><div class="party-slots">${S.party.map((id,i)=>slot(id,i)).join('')}</div><div class="section-title"><h2>周回ボーナス</h2></div><div class="card"><div class="unit-row"><div class="avatar">${lead.icon}</div><div class="unit-meta"><b>リーダーラック：${lo.luck}/99</b><div class="tiny muted">ラックが高いほどクエストの追加ドロップ率が上昇。ラック99なら大幅ボーナス。</div><div class="progress"><i style="width:${lo.luck/99*100}%"></i></div></div></div></div><div class="section-title"><h2>属性相性</h2><span class="tiny muted">弱点1.5倍 / 耐性0.75倍</span></div><div class="card tiny"><b>🔥火 → 🌿木 → 💧水 → 🔥火</b>　／　<b>✨光 ⇄ 🌑闇</b><div class="muted" style="margin-top:6px">降臨ギミックも属性で対処できます。編成を変える意味が大きくなりました。</div></div>`}

function startQuest(id){const q=[...NORMAL_QUESTS,...ADVENTS].find(x=>x.id===id);if(!q)return;if(S.stamina<q.cost){toast('スタミナが足りません');return}S.stamina-=q.cost;S.lastStaminaAt=Date.now();const fighters=S.party.map(id=>{const u=M(id),o=S.owned[id],max=Math.floor(u.baseHp*(1+(o.level-1)*.065));return{id,hp:max,maxHp:max,ult:0,guard:false}});S.battle={quest:id,enemyHp:q.hp,enemyMax:q.hp,enemyAtk:q.atk,round:1,turnIndex:0,fighters,shield:0,enemyDebuff:0,stunned:false,barrier:q.gimmick==='barrier'?520:0,barrierMax:q.gimmick==='barrier'?520:0,heat:0,aura:q.gimmick==='aura'?3:0,log:[`${q.enemy}が現れた！`,q.gimmickText?`⚙️ ${q.gimmickText}`:'属性相性を見て戦おう！']};save();render()}
function getQ(){return [...NORMAL_QUESTS,...ADVENTS].find(x=>x.id===S.battle.quest)}function intent(){const b=S.battle,q=getQ();if(q.gimmick==='heat'&&b.heat>=3)return{name:'灼熱コア暴走',mult:2.15};if(q.gimmick==='aura'&&b.aura>0&&b.round%3===0)return{name:'終焉オーラ咆哮',mult:1.75};if(b.round%4===0)return{name:'必殺攻撃',mult:1.65};if(b.round%3===0)return{name:'全体強攻撃',mult:1.28};return{name:'全体攻撃',mult:1}}
function renderBattle(el){const b=S.battle,q=getQ(),f=b.fighters[b.turnIndex];if(!f||f.hp<=0){advanceLiving();return}const u=M(f.id),it=intent(),em=elemMult(u.element,q.element),relation=elemText(u.element,q.element);let gimmick='';if(q.gimmick==='barrier')gimmick=`🛡️ 翠嵐バリア <b>${Math.max(0,b.barrier)}/${b.barrierMax}</b>${b.barrier<=0?' — BREAK!':''}`;if(q.gimmick==='heat')gimmick=`🔥 灼熱コア 熱量 <b>${b.heat}/3</b>　<span class="muted">水属性攻撃で-1</span>`;if(q.gimmick==='aura')gimmick=`🌑 終焉オーラ <b>${b.aura}/3層</b>　<span class="muted">光属性攻撃で剥離</span>`;el.innerHTML=`<div class="battle-wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div class="tiny muted">${q.name} / ROUND ${b.round}</div><h2 style="margin:0">${q.enemy} <span class="tiny tag">${q.element}</span></h2></div><button class="btn bad" onclick="retire()">リタイア</button></div><div class="enemy"><div><span class="intent">⚠ 次の行動：${it.name}</span>${gimmick?`<div class="gimmick">${gimmick}</div>`:''}</div><div class="sprite">${q.enemyIcon}</div><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><b>${q.enemy}</b><span>${Math.max(0,b.enemyHp)} / ${b.enemyMax}</span></div><div class="hpbar"><i style="width:${Math.max(0,b.enemyHp/b.enemyMax*100)}%"></i></div></div></div><div class="party-battle">${b.fighters.map((x,i)=>fighter(x,i)).join('')}</div><div class="card" style="margin-top:10px"><div class="unit-row"><div class="avatar">${u.icon}</div><div class="unit-meta"><div class="tiny muted">行動選択 ${b.turnIndex+1}/4</div><b>${u.name}</b><div class="tags"><span class="tag">${u.element}</span><span class="tag">${u.tribe}</span><span class="tag ${em>1?'element-good':em<1?'element-bad':''}">${relation}</span><span class="tag">奥義 ${f.ult}%</span></div></div></div><div class="commands"><button class="btn" onclick="battleCommand('attack')">⚔️ 攻撃<small>通常ダメージ / 奥義+18</small></button><button class="btn" onclick="battleCommand('skill')">✨ ${u.skill}<small>${u.skillDesc}</small></button><button class="btn" onclick="battleCommand('guard')">🛡️ 防御<small>受けるダメージ50%軽減</small></button><button class="btn warn" ${f.ult<100?'disabled':''} onclick="battleCommand('ult')">🌠 ${u.ult}<small>${u.ultDesc}</small></button></div></div><div class="log">${b.log.slice(-14).reverse().map(x=>`<div>${x}</div>`).join('')}</div></div>`}

function fighter(f,i){const u=M(f.id),o=S.owned[f.id];return `<div class="fighter ${i===S.battle.turnIndex?'active':''} ${f.hp<=0?'dead':''}"><div class="avatar">${u.icon}</div><div class="tiny" style="text-align:center;margin-top:4px">Lv.${o.level} ${u.name.split(' ')[1]||u.name}</div><div class="hpbar"><i style="width:${Math.max(0,f.hp/f.maxHp*100)}%"></i></div><div class="tiny muted" style="text-align:center">${Math.max(0,f.hp)}/${f.maxHp} · 🌠${f.ult}%</div></div>`}
function atk(id){const u=M(id),o=S.owned[id];return Math.floor(u.atk*(1+(o.level-1)*.058))}
function hit(v,label){const b=S.battle,q=getQ(),f=b.fighters[b.turnIndex],u=M(f.id),m=elemMult(u.element,q.element);let raw=Math.max(1,Math.floor(v*m*(.94+Math.random()*.12))),n=raw;if(q.gimmick==='barrier'&&b.barrier>0){const breakD=Math.max(1,Math.floor(raw*(u.element==='火'?1.35:1)));b.barrier=Math.max(0,b.barrier-breakD);n=Math.max(1,Math.floor(raw*.35));if(b.barrier===0){b.stunned=true;b.log.push('💥 翠嵐バリアをBREAK！ ボスが体勢を崩した')}}if(q.gimmick==='heat'&&u.element==='水'&&b.heat>0){b.heat=Math.max(0,b.heat-1);b.log.push('💧 水属性攻撃で灼熱コアの熱量-1')}if(q.gimmick==='aura'&&u.element==='光'&&b.aura>0){b.aura--;b.log.push(`✨ 光属性攻撃で終焉オーラを剥離！ 残り${b.aura}層`);if(b.aura===0)b.log.push('🌟 終焉オーラを完全解除！')}b.enemyHp-=n;const rel=m>1?' WEAK!':m<1?' RESIST':'';b.log.push(`${label}：${n}ダメージ！${rel}`)}
function healAll(rate,label){let total=0;S.battle.fighters.forEach(f=>{if(f.hp>0){const n=Math.floor(f.maxHp*rate),bef=f.hp;f.hp=Math.min(f.maxHp,f.hp+n);total+=f.hp-bef}});S.battle.log.push(`${label}：味方全体を合計${total}回復`)}function healLow(rate,label){const a=S.battle.fighters.filter(f=>f.hp>0).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp);if(!a.length)return;const f=a[0],n=Math.floor(f.maxHp*rate);f.hp=Math.min(f.maxHp,f.hp+n);S.battle.log.push(`${label}：${M(f.id).name}を${n}回復`)}
function battleCommand(type){const b=S.battle,f=b.fighters[b.turnIndex],u=M(f.id),a=atk(f.id);f.guard=false;if(type==='attack'){hit(a,`${u.name}の攻撃`);f.ult=Math.min(100,f.ult+18)}else if(type==='guard'){f.guard=true;f.ult=Math.min(100,f.ult+8);b.log.push(`${u.name}は身を守った`)}else if(type==='skill'){skillAction(f.id,a,false);f.ult=Math.min(100,f.ult+14)}else if(type==='ult'&&f.ult>=100){f.ult=0;skillAction(f.id,a,true)}if(b.enemyHp<=0){win();return}nextTurn()}
function skillAction(id,a,ult){const b=S.battle,u=M(id);if(!ult){if(['livan'].includes(id))healAll(S.owned.livan?.evolved ? .25 : .18,u.skill);else if(['slime','pix'].includes(id))healLow(id==='pix'?.35:.28,u.skill);else if(['shell','golem'].includes(id)){b.shield=Math.max(b.shield,id==='golem'?.40:.35);b.log.push(`${u.skill}：味方全体にダメージ軽減`)}else if(id==='luna'){b.shield=Math.max(b.shield,.30);b.log.push(`${u.skill}：味方全体に30%軽減`)}else if(id==='sylphin'){const sm=S.owned.sylphin?.evolved ? 1.4 : 1.2;hit(a*sm,`${u.skill}①`);hit(a*sm,`${u.skill}②`)}else if(id==='nereid'){healAll(.22,u.skill);b.fighters.forEach(x=>x.ult=Math.min(100,x.ult+10))}else if(['kraken','noct'].includes(id)){hit(a*(id==='kraken'?(S.owned.kraken?.evolved?1.9:1.6):1.55),u.skill);b.enemyDebuff=Math.max(b.enemyDebuff,.20)}else{const mult={garum:(S.owned.garum?.evolved ? 1.75 : 1.45),rabit:1.5,embercub:1.35,salam:(S.owned.salam?.evolved?2.0:1.7),griff:(S.owned.griff?.evolved?2.25:1.9),volc:(S.owned.volc?.evolved?2.4:2.05),fenrir:(S.owned.fenrir?.evolved?2.45:2.1),volt:1.85}[id]||1.55;hit(a*mult,u.skill);if(id==='volt'&&Math.random()<.2){b.stunned=true;b.log.push('⚡ 敵をスタンさせた！')}}}else{let mult={garum:(S.owned.garum?.evolved?3.2:2.7),livan:(S.owned.livan?.evolved?2.3:1.9),sylphin:(S.owned.sylphin?.evolved?2.8:2.3),rabit:2.2,embercub:2.1,salam:(S.owned.salam?.evolved?3.0:2.5),shell:1.9,kraken:(S.owned.kraken?.evolved?3.1:2.6),griff:(S.owned.griff?.evolved?3.9:3.3),volc:(S.owned.volc?.evolved?4.2:3.5),fenrir:(S.owned.fenrir?.evolved?4.4:3.65),volt:3.25,noct:2.85,pix:1.2,golem:2.0,luna:2.2,nereid:2.1,slime:0}[id]??2.5;if(mult>0)hit(a*mult,`🌠 ${u.ult}`);if(id==='livan')healAll(S.owned.livan?.evolved ? .35 : .25,u.ult);if(id==='slime')healAll(.20,u.ult);if(id==='pix')healAll(.25,u.ult);if(id==='luna')healAll(.30,u.ult);if(id==='nereid')healAll(.45,u.ult);if(id==='kraken')healAll(.15,u.ult);if(id==='sylphin')b.fighters.forEach(x=>x.ult=Math.min(100,x.ult+15));if(id==='noct')b.enemyDebuff=Math.max(b.enemyDebuff,.25)}}
function nextTurn(){let i=S.battle.turnIndex+1;while(i<S.battle.fighters.length&&S.battle.fighters[i].hp<=0)i++;if(i>=S.battle.fighters.length)enemyTurn();else{S.battle.turnIndex=i;render()}}function advanceLiving(){let i=S.battle.turnIndex;while(i<S.battle.fighters.length&&S.battle.fighters[i].hp<=0)i++;if(i>=S.battle.fighters.length)enemyTurn();else{S.battle.turnIndex=i;render()}}
function enemyTurn(){const b=S.battle,q=getQ(),it=intent();if(b.stunned){b.log.push(`${q.enemy}はBREAKして動けない！`);b.stunned=false}else{const auraMul=q.gimmick==='aura'&&b.aura>0?1.25:1;b.fighters.forEach(f=>{if(f.hp<=0)return;let d=b.enemyAtk*it.mult*auraMul*(1-b.enemyDebuff)*(1-b.shield)*(f.guard?.5:1);d=Math.max(1,Math.floor(d*(.9+Math.random()*.2)));f.hp-=d;f.ult=Math.min(100,f.ult+12)});b.log.push(`${q.enemy}の${it.name}！ 味方全体がダメージを受けた`);if(q.gimmick==='heat'){if(b.heat>=3){b.heat=0;b.log.push('🔥 灼熱コアは放熱して熱量0になった')}else{b.heat=Math.min(3,b.heat+1);b.log.push(`🔥 灼熱コアの熱量+1 → ${b.heat}/3`)}}}b.shield=0;b.enemyDebuff=Math.max(0,b.enemyDebuff-.08);b.fighters.forEach(f=>f.guard=false);if(b.fighters.every(f=>f.hp<=0)){lose();return}b.round++;b.turnIndex=0;advanceLiving()}
function gainExp(n){S.exp+=n;while(S.exp>=needExp(S.rank)){S.exp-=needExp(S.rank);S.rank++;S.maxStamina+=3;S.stamina=S.maxStamina;S.gems+=20;toast(`RANK ${S.rank}！ 星晶+20`);}}
function addMonster(id,luck=1){if(S.owned[id])S.owned[id].luck=Math.min(99,S.owned[id].luck+luck);else S.owned[id]={level:1,luck:Math.min(99,luck),evolved:false}}
function rollDrops(q,isAdv){const luck=S.owned[S.party[0]]?.luck||1,bonus=Math.min(.28,luck/99*.28),drops=[];if(isAdv){const first=!S.adventCleared.includes(q.id),hitDrop=first||Math.random()<Math.min(.95,q.dropRate+bonus);if(hitDrop){addMonster(q.drop,5);drops.push({id:q.drop,luck:5,first})}if(first)S.adventCleared.push(q.id)}else{q.drops.forEach(([id,rate])=>{if(Math.random()<Math.min(.9,rate+bonus)){addMonster(id,1);drops.push({id,luck:1})}})}return drops}
function win(){const q=getQ(),isAdv=ADVENTS.some(x=>x.id===q.id),first=!S.cleared.includes(q.id),gem=first?35:0,crystal=(isAdv?2:1)+(first?1:0);if(first)S.cleared.push(q.id);S.gems+=gem;S.gold+=q.gold;S.crystals+=crystal;gainExp(q.xp);const drops=rollDrops(q,isAdv);S.battle=null;save();render();modal(`<div class="reveal"><div style="font-size:65px">🏆</div><h2>QUEST CLEAR!</h2><p>${q.name}</p><div class="grid two"><div class="card">🪙 ${q.gold} ゴールド</div><div class="card">⭐ ${q.xp} RANK EXP</div><div class="card"><span class="crystal">🔷 進化晶 +${crystal}</span></div>${gem?`<div class="card">💎 初回 ${gem} 星晶</div>`:''}${drops.length?drops.map(d=>`<div class="card"><b>${MONSTERS[d.id].icon} ${MONSTERS[d.id].name}</b><br><span class="tiny muted">獲得 / ラック +${d.luck}${d.first?'（初回確定）':''}</span></div>`).join(''):'<div class="card">モンスタードロップなし</div>'}</div><button class="bigbtn" style="margin-top:16px" onclick="closeModal()">OK</button></div>`)}
function lose(){S.battle=null;save();render();modal(`<div class="reveal"><div style="font-size:65px">💀</div><h2>QUEST FAILED</h2><p class="muted">モンスターのレベルや編成を見直して再挑戦しよう。</p><button class="bigbtn" onclick="closeModal()">戻る</button></div>`)}function retire(){if(confirm('リタイアしますか？ スタミナは戻りません。')){S.battle=null;save();render()}}
function renderBox(el){const ids=Object.keys(S.owned).sort((a,b)=>MONSTERS[b].rarity-MONSTERS[a].rarity||S.owned[b].level-S.owned[a].level);el.innerHTML=`<div class="section-title"><div><div class="tiny muted">MONSTER BOX</div><h2>モンスター</h2></div><span class="tiny muted">${ids.length}/${Object.keys(MONSTERS).length} 種</span></div><div class="notice">すべての入手モンスターがここに入ります。先頭枠はリーダーで、ラックがクエスト報酬に影響します。</div><div class="section-title"><h2>パーティ</h2></div><div class="party-slots">${S.party.map((id,i)=>slot(id,i)).join('')}</div><div class="section-title"><h2>BOX</h2></div><div class="grid two">${ids.map(id=>monsterCard(id)).join('')}</div>`}
function monsterCard(id){const u=M(id),o=S.owned[id],cost=90+o.level*40,e=EVOLUTIONS[id],can=e&&!o.evolved&&o.level>=5&&S.crystals>=5&&S.gold>=800;return `<div class="card monster-card ${o.evolved?'evo':''}"><div class="unit-row"><div class="avatar">${u.icon}</div><div class="unit-meta"><span class="rarity">${'★'.repeat(u.rarity)}</span><b>${u.name}</b><div class="tags"><span class="tag">${u.element}</span><span class="tag">${u.tribe}</span><span class="tag">Lv.${o.level}</span><span class="tag">🍀 ${o.luck>=99?'MAX':o.luck+'/99'}</span>${o.evolved?'<span class="tag rarity">✦進化済</span>':''}</div></div></div><p class="tiny muted">入手：${u.obtain}<br>${u.skill} — ${u.skillDesc}</p><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" onclick="upgrade('${id}')" ${S.gold<cost||o.level>=50?'disabled':''}>LvUP 🪙${cost}</button><button class="btn" onclick="partyIn('${id}')">編成</button>${e&&!o.evolved?`<button class="btn warn" onclick="evolve('${id}')" ${can?'':'disabled'}>✦ 進化 Lv.5 / 🔷5 / 🪙800</button>`:''}</div>${e&&!o.evolved&&o.level<5?'<div class="tiny muted" style="margin-top:7px">進化にはLv.5が必要</div>':''}</div>`}
function evolve(id){const o=S.owned[id],e=EVOLUTIONS[id];if(!o||!e||o.evolved)return;if(o.level<5||S.crystals<5||S.gold<800){toast('進化条件が足りません');return}S.crystals-=5;S.gold-=800;o.evolved=true;save();const u=M(id);modal(`<div class="reveal"><div class="avatar spark">${u.icon}</div><div class="rarity">${'★'.repeat(u.rarity)}</div><h2>${u.name} に進化！</h2><p class="muted">HP・攻撃・スキル性能が強化されました。ラックはそのまま引き継がれます。</p><button class="bigbtn" onclick="closeModal()">OK</button></div>`)}
function upgrade(id){const o=S.owned[id],cost=90+o.level*40;if(S.gold<cost||o.level>=50)return;S.gold-=cost;o.level++;toast(`${MONSTERS[id].name} Lv.${o.level}`);render()}function partyIn(id){if(S.party.includes(id)){toast('すでに編成されています');return}const p=Number(prompt('入れ替える枠（1〜4）','1'))-1;if(!Number.isInteger(p)||p<0||p>3)return;S.party[p]=id;render()}
function renderGacha(el){const pool=['volt','luna','nereid','noct','pix','golem','garum','livan','sylphin'];el.innerHTML=`<div class="section-title"><div><div class="tiny muted">SUMMON</div><h2>星導召喚</h2></div><span class="pill">💎 ${S.gems}</span></div><section class="hero" style="background:linear-gradient(135deg,#4c2e88,#106f83 62%,#121d2c)"><div class="tiny">PICK UP ★5</div><h1 style="font-size:42px">雷機獣<br>ヴォルトロン</h1><p>★5 8% / ★4 32% / ★3 60%。10連の最後は★4以上確定。同じモンスターはラックに変換されます。</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="bigbtn" onclick="pull(1)" ${S.gems<50?'disabled':''}>1回 💎50</button><button class="bigbtn" onclick="pull(10)" ${S.gems<500?'disabled':''}>10連 💎500</button></div></section><div class="section-title"><h2>主な召喚モンスター</h2></div><div class="grid three">${pool.map(id=>{const u=MONSTERS[id];return `<div class="card"><div class="unit-row"><div class="avatar">${u.icon}</div><div><span class="rarity">${'★'.repeat(u.rarity)}</span><b style="display:block">${u.name}</b><span class="tiny muted">${u.element} / ${u.tribe}</span></div></div></div>`}).join('')}</div>`}
function roll(force4=false){const r=Math.random();let pool;if(r<.08)pool=['volt','luna','nereid'];else if(r<.40||force4)pool=['noct','garum','livan','sylphin'];else pool=['pix','golem'];return pool[Math.floor(Math.random()*pool.length)]}function pull(n){const cost=n*50;if(S.gems<cost)return;S.gems-=cost;const out=[];for(let i=0;i<n;i++){const id=roll(n===10&&i===9);addMonster(id,1);out.push(id)}save();modal(`<div><div class="reveal"><div style="font-size:58px">✨</div><h2>星導召喚</h2></div><div class="grid ${out.length>1?'two':''}">${out.map((id,i)=>{const u=M(id),o=S.owned[id];return `<div class="card spark" style="animation-delay:${i*.04}s"><div class="unit-row"><div class="avatar">${u.icon}</div><div><span class="rarity">${'★'.repeat(u.rarity)}</span><b style="display:block">${u.name}</b><span class="tiny muted">現在ラック ${o.luck}/99</span></div></div></div>`}).join('')}</div><div style="text-align:center;margin-top:16px"><button class="bigbtn" onclick="closeModal()">OK</button></div></div>`)}
function renderOther(el){el.innerHTML=`<div class="section-title"><div><div class="tiny muted">OTHER</div><h2>その他</h2></div></div><div class="grid two"><div class="card"><h3>🐾 入手ルート</h3><p class="tiny muted">初期契約 / 通常クエスト / 降臨 / 星導召喚。どこで入手しても同じモンスターBOXへ入ります。</p></div><div class="card"><h3>🍀 ラック</h3><p class="tiny muted">同じモンスターを重ねるとラック上昇。リーダーラックが高いほどドロップ率UP。最大99。</p></div><div class="card"><h3>🔺 属性相性</h3><p class="tiny muted">火→木→水→火。光と闇は互いに弱点。弱点1.5倍、耐性0.75倍。</p></div><div class="card"><h3>✦ 進化</h3><p class="tiny muted">対象モンスターをLv.5まで育成し、進化晶5個と800ゴールドで進化。ステータスと技が強化されます。</p></div><div class="card"><h3>💾 セーブ</h3><p class="tiny muted">ブラウザに自動保存。戦闘中にリロードした場合は戦闘を破棄し、消費スタミナを返却してホームへ戻ります。</p></div><div class="card"><h3>🧪 データ</h3><button class="btn bad" onclick="resetSave()">最初からやり直す</button></div></div><div class="section-title"><h2>v4 実装内容</h2></div><div class="card tiny muted">属性相性 / WEAK・RESIST表示 / 降臨ボス固有ギミック3種 / バリアBREAK / 灼熱コア / 終焉オーラ / 進化晶 / モンスター進化 / 進化後スキル強化 / 通常・降臨・ガチャ共通BOX / ラック99 / コマンド戦闘 / 自動セーブ</div>`}

function resetSave(){if(confirm('v4のセーブデータを完全に削除しますか？')){localStorage.removeItem('astraV3Save');S=fresh();render()}}function modal(html){const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(d)}function closeModal(){document.getElementById('modal')?.remove();render()}function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
tick();render();
</script></body></html>
